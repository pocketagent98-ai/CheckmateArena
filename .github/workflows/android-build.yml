name: Build Android APK

on:
  workflow_dispatch:        # run manually from the phone: Actions tab -> Run workflow
  push:
    branches: [ development, main, master ]

jobs:
  build-android:
    name: Rebrand + Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (pulls the Git-LFS assets too)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fix package folder casing (packages -> Packages)
        run: |
          if [ -d packages ] && [ ! -d Packages ]; then mv packages Packages; fi

      - name: Apply rebrand (rename everything)
        run: python3 ci/rebrand.py

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: Android
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/Android/*.apk
          if-no-files-found: error
